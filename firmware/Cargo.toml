[package]
name = "firmware"
version = "0.3.1"
edition = "2024"

[features]


[dependencies]
atsamd-hal = { workspace = true, features=["async", "dma", "rtic", "can"] }
bsp = { path = "../bsp" }
diag_common = { path = "../diag_common", features = ["mcu"] }
egs_maths={path="../egs_maths"}
egs_logic={path="../egs_logic"}
cortex-m = { workspace = true, features = [
    "inline-asm",
    "linker-plugin-lto",
    "critical-section-single-core",
] }
cortex-m-rt.workspace = true
mcan.workspace = true
usbd-serial = "0.2.2"
automotive_diag = { version = "0.1.28", default-features = false, features = [
    "kwp2000",
] }
rtic-sync = "1.5.0"

# Format and printing
defmt.workspace = true

# RTIC
rtic = { version = "2.3.0", features = ["thumbv7-backend"] }
heapless = "0.9.3"

futures = { version = "0.3.33", default-features = false }
bitbybit = "2.0.1"
arbitrary-int = "2.1.1"
libm = "0.2.16"
bitflags = "2.13.1"
atsamd-hal-macros = "0.3.0"
seq-macro = "0.3.6"
pastey = "0.2.3"
embedded-alloc = "0.7.0"
derived = "0.4.2"
bbqueue = "0.7.0"
ekv = "1.0.0"
embassy-sync = "=0.6.2"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["now"] }
rustc_version = "0.4.1"
vergen = { version = "9.1.0" }
vergen-git2 = { version = "9.1.0" }

[profile.release]
debug = true
#strip="symbols"
lto = "fat"
opt-level = 3
codegen-units = 1
#panic="abort"

# For cargo flash
[package.metadata]
chip = "ATSAME54P20A"
